<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>My Interactive Shopping List</h1>
    <div class="container">
        <form id="inputForm">
            <input type="text" id="itemName" placeholder="Product name" required>
            <input type="number" id="itemPrice" placeholder="Price" required>
            <button type="submit" id="addButton">Add items</button>
        </form>

        <hr>
        
        <section id="list">
            <div class="buttonDiv">
                <form id="buttons">
                    <button type="submit" id="clearButton">Clear list</button>
                    <button type="submit" id="totalButton">Total</button>
                </form>
            </div>
        </section>

    </div>

    <script src="main.js"></script>
</body>
</html>
