<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Interactive Shopping List</h1>
    </header>

    <div class="container">
        <form id="inputForm">
            <input type="text" id="itemName" placeholder="Product name" required>
            <input type="number" id="itemPrice" placeholder="Price" required>
            <button type="button" id="addButton">Add items</button>
        </form>

        <div class="listItems">
            <section id="list"></section>
            
            <div id="buttonDiv">
                <button type="button" id="clearButton">Clear list</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
